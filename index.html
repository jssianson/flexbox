<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Website</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <nav class="navbar">
      <a href="#" class="logo">My Website</a>

      <div class="links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
      </div>

      <button class="nav-button">Get Started</button>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <h1>Welcome to My Website</h1>
      <p>A responsive webpage using Flexbox, CSS Grid, and media queries.</p>
      <button class="main-button">Learn More</button>
    </section>

    <section class="cards" id="services">
      <article class="card">
        <h2>Design</h2>
        <p>Clean and simple website design.</p>
      </article>

      <article class="card">
        <h2>Development</h2>
        <p>Responsive layouts that work on different screens.</p>
      </article>

      <article class="card">
        <h2>Support</h2>
        <p>Helpful services for your website.</p>
      </article>
    </section>
  </main>

  <footer id="contact">
    <p>&copy; 2026 My Website</p>
  </footer>

</body>
</html>
